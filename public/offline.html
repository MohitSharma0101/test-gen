<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>You're offline · Education+ Staff</title>
    <style>
      :root { --brand: #0053c5; --fg: #0f172a; --muted: #64748b; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
        padding: 24px; background: #f8fafc; color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center;
      }
      main { max-width: 320px; }
      img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 1px 3px rgb(0 0 0 / 0.08); }
      h1 { font-size: 20px; margin: 24px 0 8px; }
      p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; }
      button {
        appearance: none; border: 0; border-radius: 10px; background: var(--brand); color: #fff;
        font: 600 15px/1 inherit; padding: 14px 24px; min-width: 160px; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Education+ Staff needs the internet to load your papers and records. Check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      // Come back by itself as soon as the connection returns
      window.addEventListener("online", function () { location.reload(); });
    </script>
  </body>
</html>
