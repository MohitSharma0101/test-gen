# Nightly MongoDB backup -> encrypted -> Cloudflare R2. See docs/BACKUP.md.
name: DB backup

on:
  schedule:
    - cron: "17 21 * * *" # 02:47 IST daily
  workflow_dispatch:
    inputs:
      label:
        description: "Optional label (e.g. before-remark). Stored under manual/ and never pruned automatically."
        required: false

concurrency: db-backup

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DB_NAME: ${{ vars.DB_NAME || 'test' }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      MONGO_URI: ${{ secrets.MONGO_BACKUP_URI }}
    steps:
      - uses: actions/checkout@v5
      - name: Dump, encrypt, upload
        run: |
          source scripts/backup/common.sh
          install_tools
          stamp=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          if [ -n "${{ inputs.label }}" ]; then
            name="manual/${stamp}-$(echo '${{ inputs.label }}' | tr -cd 'a-zA-Z0-9-_')"
          else
            name="daily/${stamp}"
          fi
          counts "$MONGO_URI" "$DB_NAME" > /tmp/counts.json
          mongodump --uri="$MONGO_URI" --db="$DB_NAME" --gzip --archive=/tmp/db.archive.gz
          encrypt /tmp/db.archive.gz /tmp/db.archive.gz.enc
          r2 s3 cp /tmp/db.archive.gz.enc "s3://${R2_BUCKET}/${name}.archive.gz.enc"
          r2 s3 cp /tmp/counts.json "s3://${R2_BUCKET}/${name}.counts.json"
          {
            echo "### Backup"
            echo "| | |"
            echo "|---|---|"
            echo "| File | \`${name}.archive.gz.enc\` |"
            echo "| Size (encrypted) | $(du -h /tmp/db.archive.gz.enc | cut -f1) |"
            echo "| Database | \`${DB_NAME}\` |"
            echo "| Collections | $(jq 'length' /tmp/counts.json) |"
            echo "| Documents | $(jq '[.[]] | add' /tmp/counts.json) |"
            echo "| Time (IST) | $(TZ=Asia/Kolkata date '+%d %b %Y, %H:%M') |"
            echo
            echo "### Documents per collection"
            echo "| Collection | Documents |"
            echo "|---|---:|"
            jq -r 'to_entries | sort_by(-.value)[] | "| \(.key) | \(.value) |"' /tmp/counts.json
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -z "${{ inputs.label }}" ]; then
            # Sundays also go to weekly/, the 1st of the month to monthly/
            if [ "$(TZ=Asia/Kolkata date +%u)" = 7 ]; then
              for f in archive.gz.enc counts.json; do r2 s3 cp "s3://${R2_BUCKET}/${name}.$f" "s3://${R2_BUCKET}/weekly/${stamp}.$f"; done
            fi
            if [ "$(TZ=Asia/Kolkata date +%d)" = 01 ]; then
              for f in archive.gz.enc counts.json; do r2 s3 cp "s3://${R2_BUCKET}/${name}.$f" "s3://${R2_BUCKET}/monthly/${stamp}.$f"; done
            fi
            prune daily/ 7; prune weekly/ 4; prune monthly/ 12
          fi
